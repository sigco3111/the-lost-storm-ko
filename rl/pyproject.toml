[project]
name = "lost-storm-rl"
version = "0.1.0"
description = "Trains a policy that plays The Lost Storm through its headless simulation."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "torch>=2.8",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
